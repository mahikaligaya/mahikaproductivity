  ['today', 'Today', 'today'], ['garden', 'Garden & Leads', 'garden'], ['tasks', 'Tasks', 'tasks'], ['calendar', 'Calendar', 'cal'],
  ['content', 'Content', 'edit'], ['dump', 'Dump & Notes', 'dump'], ['focus', 'Focus', 'focus'],['rest', 'Rest & Leave', 'rest'], ['settings', 'Settings', 'settings'],
];
const wsOn = ws => S.settings.wsFilter === 'all' || S.settings.wsFilter === ws;
const wsTag = ws => `<span class="tag tag-${ws}">${WS[ws].short}</span>`;
const justBloomed = key => UI.bloomKey === key && Date.now() < UI.bloomUntil;

function greeting() { const h = hourPH(); return h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

function dueLabel(t) {
  if (!t.due) return t.optional ? '<span class="due due-soft">whenever suits</span>' : '';
  const d = diffDays(todayPH(), t.due);
  let txt = fmtDate(t.due), cls = '';
  if (d < 0) { txt = t.optional ? `was ${fmtDate(t.due)} · no pressure` : `carried over · ${fmtDate(t.due)}`; cls = t.optional ? 'due-soft' : 'due-past'; }
  else if (d === 0) { txt = 'today'; cls = 'due-today'; }
  else if (d === 1) txt = 'tomorrow';
  else if (d < 7) txt = fmtDate(t.due, { weekday: 'long' });
  return `<span class="due ${cls}">${icon('cal')}${txt}</span>`;
}

function taskRow(t, o = {}) {
  const done = t.status === 'done', today = todayPH();
  const steps = t.subtasks.length ? `<span class="meta-item">${t.subtasks.filter(s => s.done).length}/${t.subtasks.length} steps</span>` : '';
  const isTop = t.top3 === today;
  return `<li class="task ws-${t.ws} ${done ? 'is-done' : ''}" data-id="${t.id}">
    <button class="check" data-act="toggle-done" data-id="${t.id}" aria-label="${done ? 'Mark as not done' : 'Complete'}: ${esc(t.title)}">${icon('check')}</button>
    <div class="task-main" data-act="edit-task" data-id="${t.id}" role="button" tabindex="0" aria-label="Open ${esc(t.title)}">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        ${o.showWs ? wsTag(t.ws) : ''}
        <span class="prio prio-${t.priority}" title="${PRIORITIES[t.priority]} priority">${PRIORITIES[t.priority]}</span>
        ${t.category ? `<span class="meta-item">${esc(t.category)}</span>` : ''}
        ${dueLabel(t)}
        ${t.status === 'doing' ? '<span class="badge badge-doing">In progress</span>' : ''}
        ${t.status === 'waiting' ? '<span class="badge badge-waiting">Waiting for approval</span>' : ''}
        ${t.contentId ? `<span class="badge badge-content">${icon('edit')} content</span>` : ''}
        ${t.optional ? '<span class="badge badge-opt">optional</span>' : ''}
        ${steps}
      </div>
    </div>
    <div class="task-actions">
      ${done ? '' : `<button class="icon-btn ${isTop ? 'on' : ''}" data-act="toggle-top" data-id="${t.id}" title="${isTop ? 'Remove from' : 'Add to'} today’s top 3" aria-pressed="${isTop}">${icon('star')}</button>
      <button class="icon-btn" data-act="focus-task" data-id="${t.id}" title="Focus on this">${icon('focus')}</button>
      <button class="icon-btn" data-act="postpone" data-id="${t.id}" title="Move to another day">${icon('later')}</button>`}
      ${o.full ? `<button class="icon-btn" data-act="delete-task" data-id="${t.id}" title="Delete">${icon('trash')}</button>` : ''}
    </div>
  </li>`;
}

function emptyNote(text, art = true) { return `<div class="empty">${art ? seedlingArt(64) : ''}<p>${text}</p></div>`; }

/* ---------------- TODAY ---------------- */
function V_today() {
  const d = todayPH(), top = top3Today(), flags = [0, 1, 2].map(i => top[i] ? top[i].status === 'done' : false);
  const stsOff = offEntry('sts', d), bbOff = offEntry('bb', d), mode = S.status.mode;
  const done = doneToday();
  const banner = [];
  const bh = bankHoliday(d);
  if (bh) banner.push(`<div class="banner banner-holiday">${icon('sparkle')} <span><b>UK bank holiday: ${esc(bh)}.</b> ${isWorkday('sts', d) ? 'You’re marked as working for STS today.' : 'No STS lead target today.'}</span></div>`);
  if (stsOff) banner.push(`<div class="banner banner-rest">${icon('rest')} <span><b>STS ${LEAVE_TYPES[stsOff.type].toLowerCase()}.</b> No lead target today — enjoy the quiet.</span></div>`);
  if (bbOff) banner.push(`<div class="banner banner-rest">${icon('rest')} <span><b>B&amp;B ${LEAVE_TYPES[bbOff.type].toLowerCase()}.</b> Nothing is expected here today.</span></div>`);
  if (mode === 'away' || mode === 'break') banner.push(`<div class="banner banner-pause">${icon('clock')} <span>You’re <b>${MODES[mode].toLowerCase()}</b>. Everything is saved and paused. <button class="link" data-act="set-mode" data-mode="working">I’m back</button></span></div>`);

  const blocks = {
    hero: `<div class="hero card card-hero">
        ${sprig('hero-sprig')}
        <div class="hero-text">
          <p class="eyebrow">${fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long' })}</p>
          <h1>${greeting()}${S.settings.userName ? ', ' + esc(S.settings.userName) : ''}.</h1>
          <p class="lede">${heroLine(top, done.length)}</p>
          <div class="hero-actions">
            <button class="btn btn-primary" data-act="what-next">${icon('sparkle')} What should I do next?</button>
            <button class="btn btn-ghost btn-sm" data-act="go" data-view="focus">${icon('focus')} Focus</button>
            <button class="btn btn-ghost btn-sm" data-act="go" data-view="dump">${icon('dump')} Brain dump</button>
          </div>
        </div>
      </div>`,
    fx: fxCard(),
    verse: S.settings.showVerse !== false ? verseCard() : '',
    top3: `<article class="card card-top3">
          <header class="card-head"><h2>Today’s top 3</h2><span class="hint">Just three.</span></header>
          <div class="top3-wrap">
            <ol class="top3-list">${[0, 1, 2].map(i => top[i] ? top3Item(top[i]) : `<li class="top3-empty"><button class="slot" data-act="pick-top">${icon('plus')} Choose a priority</button></li>`).join('')}</ol>
            <div class="top3-illustration ${justBloomed('top3') ? 'reveal' : ''}">${top3Art(flags)}<p class="art-caption">${flags.every(Boolean) && top.length === 3 ? 'Illustration complete ✿' : `${flags.filter(Boolean).length} of 3 blooms`}</p></div>
          </div>
        </article>`,
    leads: wsOn('sts') ? leadsCard(d) : '',
    garden: `<article class="card card-garden">
          <header class="card-head"><h2>Today’s garden</h2><span class="hint">${done.length ? `${done.length} bloom${done.length > 1 ? 's' : ''}` : 'one task away'}</span></header>
          <div class="garden-bed">${done.length ? done.map((a, i) => miniFlower(flowerTypeFor(a.taskId || a.id, a.ws), 28, i * 60, a.text)).join('') : '<p class="muted small">Your first bloom is one small task away.</p>'}</div>
        </article>`,
    commit: `<article class="card card-commit"><header class="card-head"><h2>Commitments</h2><button class="link small" data-act="meet-open">${icon('cal')} Meetings</button></header>${commitments(d)}</article>`,
    upcoming: `<article class="card card-upcoming"><header class="card-head"><h2>Upcoming</h2><span class="hint">next 7 days</span></header>${upcoming(d)}</article>`,
  };
  return `<section class="view view-today ${UI.todayEdit ? 'is-arranging' : ''}">
    ${banner.join('')}
    ${todayGrid(blocks)}
  </section>`;
}

/* ---------- Today layout: drag to reorder, resize, hide (saved in settings) ---------- */
const TODAY_BLOCKS = { hero: 'Greeting', fx: 'Exchange rates', verse: 'Daily verse', top3: 'Top 3', leads: 'Qualified leads', garden: 'Today’s garden', commit: 'Commitments', upcoming: 'Upcoming' };
const TODAY_DEFAULT = [['hero', 7], ['verse', 5], ['fx', 8], ['top3', 5], ['leads', 4], ['commit', 3], ['garden', 5], ['upcoming', 7]];
UI.todayEdit = false;
function todayLayout() {
  let L = Array.isArray(S.settings.todayLayout) ? S.settings.todayLayout.filter(b => TODAY_BLOCKS[b.id]).map(b => ({ ...b })) : null;
  if (!L || !L.length) L = TODAY_DEFAULT.map(([id, span]) => ({ id, span, hidden: false }));
  TODAY_DEFAULT.forEach(([id, span]) => { if (!L.some(b => b.id === id)) L.push({ id, span, hidden: false }); });
  return L;
}
function setTodayLayout(L) { S.settings.todayLayout = L; commit(); }
function todayGrid(blocks) {
  const L = todayLayout(), edit = UI.todayEdit;
  const items = L.filter(b => !b.hidden && blocks[b.id]).map(b => {
    const n = TODAY_BLOCKS[b.id];
    const bar = edit ? `<div class="tb-bar"><span class="tb-handle" title="Drag to move">⠿ ${n}</span><span class="spacer"></span>
      <button class="icon-btn" data-act="tb-move" data-id="${b.id}" data-d="-1" title="Move earlier" aria-label="Move ${n} earlier">‹</button>
      <button class="icon-btn" data-act="tb-move" data-id="${b.id}" data-d="1" title="Move later" aria-label="Move ${n} later">›</button>
      <button class="icon-btn" data-act="tb-size" data-id="${b.id}" data-d="-1" title="Narrower" aria-label="Make ${n} narrower">−</button>
      <span class="tb-span">${b.span}/12</span>
      <button class="icon-btn" data-act="tb-size" data-id="${b.id}" data-d="1" title="Wider" aria-label="Make ${n} wider">+</button>
      <button class="icon-btn" data-act="tb-hide" data-id="${b.id}" title="Hide this block" aria-label="Hide ${n}">×</button></div>` : '';
    const extra = b.id === 'fx' && UI.fxOpen ? `<div class="tblock tb-fxpanel" style="--span:12">${fxDetails()}</div>` : '';
    return `<div class="tblock tb-${b.id}" style="--span:${b.span}" data-block="${b.id}" ${edit ? 'draggable="true"' : ''}>${bar}${blocks[b.id]}</div>${extra}`;
  }).join('');
  const hidden = L.filter(b => b.hidden);
  return `<div class="today-tools">${edit ? `<span class="small muted">Drag blocks to move them · − / + to resize.</span>${hidden.length ? `<span class="small">Hidden: ${hidden.map(b => `<button class="chip" data-act="tb-show" data-id="${b.id}">+ ${TODAY_BLOCKS[b.id]}</button>`).join(' ')}</span>` : ''}<span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="tb-reset">Reset layout</button><button class="btn btn-primary btn-sm" data-act="tb-edit">Done</button>`
    : `<span class="spacer"></span><button class="link small" data-act="tb-edit">${icon('edit')} Arrange blocks</button>`}</div>
    <div class="today-blocks">${items}</div>`;
}
Object.assign(EXT_ACT, {
  'tb-edit': () => { UI.todayEdit = !UI.todayEdit; render(); },
  'tb-reset': () => { S.settings.todayLayout = null; commit(); toast('Layout reset'); },
  'tb-size': el => { const L = todayLayout(), b = L.find(x => x.id === el.dataset.id); b.span = clamp(b.span + +el.dataset.d, 3, 12); setTodayLayout(L); },
  'tb-hide': el => { const L = todayLayout(); L.find(x => x.id === el.dataset.id).hidden = true; setTodayLayout(L); },
  'tb-show': el => { const L = todayLayout(); L.find(x => x.id === el.dataset.id).hidden = false; setTodayLayout(L); },
  'tb-move': el => {
    const L = todayLayout(), vis = L.filter(b => !b.hidden), i = vis.findIndex(b => b.id === el.dataset.id), j = i + +el.dataset.d;
    if (j < 0 || j >= vis.length) return;
    const a = L.indexOf(vis[i]), c = L.indexOf(vis[j]); [L[a], L[c]] = [L[c], L[a]]; setTodayLayout(L);
    setTimeout(() => { const btn = $(`[data-act="tb-move"][data-id="${el.dataset.id}"][data-d="${el.dataset.d}"]`); if (btn) btn.focus(); }, 30);
  },
});
let tbDrag = null;
document.addEventListener('dragstart', e => { const b = e.target.closest && e.target.closest('.is-arranging .tblock[data-block]'); if (!b) return; tbDrag = b.dataset.block; b.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', tbDrag); } catch (_) {} });
document.addEventListener('dragend', () => { tbDrag = null; $$('.tblock.dragging, .tblock.drop-on').forEach(x => x.classList.remove('dragging', 'drop-on')); });
document.addEventListener('dragover', e => { if (!tbDrag) return; const t = e.target.closest && e.target.closest('.tblock[data-block]'); if (!t) return; e.preventDefault(); $$('.tblock.drop-on').forEach(x => { if (x !== t) x.classList.remove('drop-on'); }); if (t.dataset.block !== tbDrag) t.classList.add('drop-on'); });
document.addEventListener('drop', e => {
  if (!tbDrag) return; const t = e.target.closest && e.target.closest('.tblock[data-block]'); if (!t) return; e.preventDefault();
  const L = todayLayout(), from = L.findIndex(b => b.id === tbDrag), to = L.findIndex(b => b.id === t.dataset.block);
  if (from < 0 || to < 0 || from === to) return;
  const [m] = L.splice(from, 1); L.splice(L.findIndex(b => b.id === t.dataset.block) + (from < to ? 1 : 0), 0, m);
  tbDrag = null; setTodayLayout(L);
});

function heroLine(top, doneCount) {
  const open = top.filter(t => t.status !== 'done').length;
  if (S.status.mode === 'off') return 'It’s a day off. Rest is productive too — nothing here needs you.';
  if (top.length === 3 && !open) return 'All three priorities done. Anything else today is a bonus.';
  if (!top.length) return 'Pick up to three priorities, or let me suggest where to start.';
  if (doneCount) return `${doneCount} thing${doneCount > 1 ? 's' : ''} done already. Keep it gentle.`;
  return 'One small step is enough to get going.';
}

function top3Item(t) {
  const done = t.status === 'done';
  return `<li class="top3-item ws-${t.ws} ${done ? 'is-done' : ''}">
    <button class="check" data-act="toggle-done" data-id="${t.id}" aria-label="${done ? 'Mark as not done' : 'Complete'}: ${esc(t.title)}">${icon('check')}</button>
    <div class="task-main" data-act="edit-task" data-id="${t.id}" role="button" tabindex="0"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${wsTag(t.ws)} ${dueLabel(t)}</div></div>
    ${done ? '' : `<button class="icon-btn" data-act="focus-task" data-id="${t.id}" title="Focus on this">${icon('focus')}</button>`}
    <button class="icon-btn" data-act="toggle-top" data-id="${t.id}" title="Remove from top 3">×</button>
  </li>`;
}

function leadFlowers(d, size) {
  const n = leadsOn(d), goal = Math.max(leadGoal(d), 0), slots = Math.max(goal, 4);
  let html = '';
  for (let i = 0; i < slots; i++) {
    const bloomed = i < n, extraSlot = i >= goal;
    html += `<div class="lead-flower ${extraSlot ? 'extra' : ''}">${flowerSVG({ type: [0, 1, 2, 3][i % 4], size, bloomed, anim: bloomed && justBloomed('lead-' + i), label: bloomed ? `Lead ${i + 1} qualified` : `Lead ${i + 1} not yet` })}</div>`;
  }
  const bonus = n > slots ? `<div class="bonus-blooms" title="Bonus leads">+${n - slots}</div>` : '';
  return `<div class="lead-flowers">${html}${bonus}</div>`;
}

function leadsCard(d) {
  if (!isWorkday('sts', d)) {
    return `<article class="card card-leads"><header class="card-head"><h2>Qualified leads</h2></header>
      <div class="rest-note">${icon('rest')}<p>Not an STS working day, so there’s no lead target. Your monthly pace already accounts for it.</p></div>
      ${!isOff('sts', d) ? `<button class="link small" data-act="work-override" data-ws="sts" data-date="${d}">I’m working STS today</button>` : ''}
      ${leadsOn(d) ? `<p class="small muted">Logged today anyway: ${leadsOn(d)}</p>` : ''}</article>`;
  }
  const n = leadsOn(d), goal = leadGoal(d), p = leadPace(d);
  return `<article class="card card-leads">
    <header class="card-head"><h2>Qualified leads</h2><span class="hint">${n} of ${goal} today</span></header>
    ${leadFlowers(d, 44)}
    ${bkTrack(d, true)}
    <div class="lead-actions">
      <button class="btn btn-rose" data-act="lead" data-delta="1">${icon('plus')} Qualified a lead</button>
      <button class="icon-btn" data-act="lead" data-delta="-1" title="Remove one (correction)" ${n ? '' : 'disabled'}>−</button>
      <button class="link small" data-act="go" data-view="garden">Month view</button>
    </div>
    <p class="small muted">${fmtMonth(monthKey(d))}: <b>${p.total}</b> / ${S.settings.leadMonthlyMin} · pace ≈ ${p.min.toFixed(1)}/day for ${S.settings.leadMonthlyMin}</p>
  </article>`;
}

function commitments(d) {
  const items = [], mk = monthKey(d), stsWork = isWorkday('sts', d), todays = meetingsOn(d);
  todays.forEach(o => items.push({ lk: 'meet:' + o.m.id, text: esc(o.m.title), sub: `Today · ${meetingTimeLabel(o)}${o.m.notes ? ' · ' + esc(o.m.notes) : ''}` }));
  if (!todays.length) { const n = nextMeetingFrom(addDays(d, 1), 7); if (n) items.push({ lk: 'meet:' + n.m.id, text: `Next: ${esc(n.m.title)}`, sub: `${fmtDate(n.date, { weekday: 'long', day: 'numeric', month: 'short' })} · ${meetingTimeLabel(n)}` }); }
  const m = todays.find(o => o.m.id === 'm-weekly');
  if (dow(d) === 5 && stsWork) items.push({ lk: 'ppt-update', key: `${d}:ppt-update`, text: 'Update the meeting PowerPoint', sub: 'Wins, ongoing projects, blockers, next priorities' });
  if (dow(d) === 1 && stsWork) items.push({ lk: 'ppt-review', key: `${d}:ppt-review`, text: 'Review the PowerPoint before the meeting', sub: m ? `Meeting at ${fmtTime(m.inst, TZ_PH)}` : '' });
  if (+d.slice(8) <= 7 && stsWork) {
    items.push({ lk: 'monthly-focus', key: focusKey(mk), text: 'Check this month’s marketing focus', sub: 'Monthly' });
    items.push({ lk: 'spotlight', key: `${mk}:spotlight`, text: 'Plan this month’s employee spotlight', sub: 'Monthly' });
  }
  if (wsOn('sts')) { const ci = contentCommitment(); if (ci) items.push(ci); }
  if (wsOn('bb') && !isOff('bb', d)) items.push({ lk: 'bb-time', text: 'Barn & Brass time', sub: 'About 2 flexible hours, usually after STS' });
  return `<ul class="commit-list">${items.map(i => `<li class="${i.key && S.checks[i.key] ? 'is-done' : ''}">
    ${i.key ? `<button class="check small-check" data-act="check" data-key="${i.key}" aria-pressed="${!!S.checks[i.key]}" aria-label="Mark ${esc(i.text)}">${icon('check')}</button>` : `<span class="dot-ico">${icon('clock')}</span>`}
    <div class="commit-main"><div>${i.text}</div>${i.sub ? `<div class="small muted">${i.sub}</div>` : ''}${i.lk && linksOf(i.lk).length ? `<div class="cm-links">${linkChips(i.lk)}</div>` : ''}</div>
    ${i.lk ? `<button class="icon-btn link-btn" data-act="link-open" data-lk="${i.lk}" data-title="${i.text}" title="Add or edit links" aria-label="Links for ${i.text}">${icon('link')}</button>` : ''}</li>`).join('')}</ul>`;
}

function upcoming(d) {
  const end = addDays(d, 7);
  const list = openTasks().filter(t => t.due && t.due <= end && wsOn(t.ws) && !(t.optional && t.due < d)).sort((a, b) => a.due.localeCompare(b.due));
  if (!list.length) return emptyNote('No deadlines in the next week.', false);
  const past = list.filter(t => t.due < d), rest = list.filter(t => t.due >= d);
  const shownPast = past.slice(0, 3);
  return `<ul class="task-list">${[...shownPast, ...rest.slice(0, 8)].map(t => taskRow(t, { showWs: true })).join('')}</ul>
    ${past.length > 3 ? `<p class="small muted">+ ${past.length - 3} more carried over — <button class="link" data-act="go-tasks" data-due="overdue">see them when you’re ready</button></p>` : ''}`;
}

/* ---------------- TASKS ---------------- */
function V_tasks() {
  const f = S.settings.wsFilter, q = UI.taskQ.toLowerCase(), d = todayPH();
  const match = t => {
    if (UI.taskStatus === 'open' && t.status === 'done') return false;
    if (!['open', 'all'].includes(UI.taskStatus) && t.status !== UI.taskStatus) return false;
    if (q && !(t.title + ' ' + t.notes + ' ' + t.category).toLowerCase().includes(q)) return false;
    const due = UI.taskDue;
    if (due === 'overdue') return t.due && t.due < d && t.status !== 'done';
    if (due === 'today') return t.due === d;
    if (due === 'week') return t.due && t.due >= d && t.due <= addDays(d, 7);
    if (due === 'none') return !t.due;
    return true;
  };
  const chip = (key, val, label) => `<button class="chip ${UI[key] === val ? 'on' : ''}" data-act="task-filter" data-key="${key}" data-val="${val}">${label}</button>`;
  const groups = ['sts', 'bb'].filter(wsOn).map(ws => {
    const list = liveTasks().filter(t => t.ws === ws && match(t))
      .sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.due || '9999').localeCompare(b.due || '9999') || ({ high: 0, med: 1, low: 2 }[a.priority] - { high: 0, med: 1, low: 2 }[b.priority]));
    return `<section class="card card-ws ws-${ws}">
      <header class="card-head"><h2><span class="ws-dot"></span>${WS[ws].name}</h2><span class="hint">${list.length} task${list.length === 1 ? '' : 's'}</span></header>
      ${list.length ? `<ul class="task-list">${list.map(t => taskRow(t, { full: true })).join('')}</ul>` : emptyNote('Nothing matches these filters.', false)}
      <div class="card-foot"><button class="link" data-act="quick-add" data-ws="${ws}">${icon('plus')} Add ${WS[ws].short} task</button></div>
    </section>`;
  }).join('');
  return `<section class="view">
    <header class="view-head"><div><p class="eyebrow">Task manager</p><h1>Tasks</h1></div>
      <button class="btn btn-primary" data-act="quick-add">${icon('plus')} New task</button></header>
    <div class="toolbar card">
      <label class="search">${icon('sparkle')}<input type="search" id="task-search" placeholder="Search tasks…" value="${esc(UI.taskQ)}" aria-label="Search tasks"></label>
      <div class="chips" role="group" aria-label="Status">${chip('taskStatus', 'open', 'Open')}${chip('taskStatus', 'todo', 'To Do')}${chip('taskStatus', 'doing', 'In Progress')}${chip('taskStatus', 'waiting', 'Waiting')}${chip('taskStatus', 'done', 'Completed')}${chip('taskStatus', 'all', 'All')}</div>
      <div class="chips" role="group" aria-label="Deadline">${chip('taskDue', 'any', 'Any date')}${chip('taskDue', 'overdue', 'Carried over')}${chip('taskDue', 'today', 'Today')}${chip('taskDue', 'week', 'Next 7 days')}${chip('taskDue', 'none', 'No date')}</div>
      <p class="small muted">Showing: ${f === 'all' ? 'both workspaces (kept separate)' : WS[f].name} · change in the top bar</p>
    </div>
    <div class="grid grid-ws">${groups}</div>
  </section>`;
}

/* ---------------- BRAIN DUMP ---------------- */
function V_dumpInbox() {
  const items = S.inbox.filter(i => !i.processed).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const processed = S.inbox.filter(i => i.processed);
  return `<section class="view view-dump">
    <header class="view-head"><div><p class="eyebrow">Inbox</p><h1>Brain dump</h1><p class="lede">Get it out of your head. Sort it later — or never.</p></div></header>
    <form class="card dump-form" data-form="dump">
      ${sprig('dump-sprig')}
      <label for="dump-text" class="sr-only">Brain dump</label>
      <textarea id="dump-text" name="text" rows="4" data-draft="dump" placeholder="Thoughts, reminders, half-ideas… Press Enter to save (Shift+Enter for a new line). Your typing is kept as a draft automatically."></textarea>
      <div class="form-row"><label class="check-label"><input type="checkbox" name="split"> Save each line as a separate note</label><span class="draft-status small muted" data-draft-status></span><button class="btn btn-primary" type="submit">Save to inbox</button></div>
    </form>
    <div class="inbox">
      ${items.length ? items.map(i => `<article class="card note">
        <p class="note-text">${esc(i.text).replace(/\n/g, '<br>')}</p>
        <div class="note-foot"><span class="small muted">${relTime(i.createdAt)}</span>
          <div class="note-actions">
            <button class="btn btn-sm btn-sage" data-act="note-to-task" data-id="${i.id}" data-ws="sts">→ STS task</button>
            <button class="btn btn-sm btn-rose" data-act="note-to-task" data-id="${i.id}" data-ws="bb">→ B&amp;B task</button>
            <button class="btn btn-sm btn-ghost" data-act="note-done" data-id="${i.id}" title="Mark as dealt with">Done with it</button>
            <button class="icon-btn" data-act="note-delete" data-id="${i.id}" title="Delete note">${icon('trash')}</button>
          </div></div></article>`).join('') : emptyNote('Your inbox is clear. Nothing rattling around.')}
    </div>
    ${processed.length ? `<button class="link" data-act="toggle-ui" data-key="showProcessed">${UI.showProcessed ? 'Hide' : 'Show'} ${processed.length} sorted note${processed.length > 1 ? 's' : ''}</button>
      ${UI.showProcessed ? `<ul class="plain-list">${processed.slice().reverse().map(i => `<li><span>${esc(i.text.slice(0, 140))}</span> <span class="small muted">${i.taskId ? 'became a task' : 'sorted'} · ${relTime(i.createdAt)}</span> <button class="link small" data-act="note-restore" data-id="${i.id}">restore</button></li>`).join('')}</ul>` : ''}` : ''}
  </section>`;
}

/* ---------------- FOCUS ---------------- */
function V_focus() {
  const t = S.focus.taskId && getTask(S.focus.taskId);
  if (!t || t.deletedAt) {
    const ranked = rankTasks().slice(0, 6);
    return `<section class="view view-focus">
      <header class="view-head"><div><p class="eyebrow">Focus mode</p><h1>One thing at a time</h1><p class="lede">Choose a task, or let me pick one for you.</p></div></header>
      <div class="card">
        <button class="btn btn-primary btn-lg" data-act="what-next">${icon('sparkle')} Pick for me</button>
        ${ranked.length ? `<ul class="pick-list">${ranked.map(({ t }) => `<li><button class="pick" data-act="focus-task" data-id="${t.id}">${wsTag(t.ws)} <span>${esc(t.title)}</span> ${dueLabel(t)}</button></li>`).join('')}</ul>` : emptyNote('No open tasks yet. Add one and we’ll focus together.')}
      </div></section>`;
  }
  const tm = S.focus.timer, rem = timerRemaining(), stepsDone = t.subtasks.filter(s => s.done).length;
  const nextStep = t.subtasks.find(s => !s.done);
  const done = t.status === 'done';
  return `<section class="view view-focus">
    <header class="view-head"><div><p class="eyebrow">Focus mode · ${WS[t.ws].name}</p></div>
      <div class="row"><button class="btn btn-ghost btn-sm" data-act="focus-switch">Switch task</button><button class="btn btn-ghost btn-sm" data-act="focus-clear">Leave focus</button></div></header>
    <div class="focus-layout">
      <article class="card focus-card ws-${t.ws} ${done ? 'is-done' : ''}">
        ${sprig('focus-sprig')}
        <h1 class="focus-title">${esc(t.title)}</h1>
        <div class="task-meta">${wsTag(t.ws)} ${dueLabel(t)} ${t.category ? `<span class="meta-item">${esc(t.category)}</span>` : ''}</div>
        ${t.contentId ? contentFocusPanel(t) : ''}
        ${t.notes ? `<details class="notes"><summary>Notes</summary><p>${esc(t.notes).replace(/\n/g, '<br>')}</p></details>` : ''}
        <label class="field"><span>Next tiny action</span>
          <input id="next-action" type="text" value="${esc(S.focus.nextAction)}" placeholder="${esc(nextStep ? nextStep.title : 'e.g. Open the doc and write one sentence')}"></label>
        <div class="steps">
          <div class="steps-head"><h3>Steps</h3><span class="small muted">${t.subtasks.length ? `${stepsDone} of ${t.subtasks.length}` : 'Break it into small pieces'}</span></div>
          <ul class="step-list">${t.subtasks.map(s => `<li class="${s.done ? 'is-done' : ''}"><button class="check small-check" data-act="step-toggle" data-id="${s.id}" aria-label="Toggle step ${esc(s.title)}">${icon('check')}</button><span>${esc(s.title)}</span><button class="icon-btn" data-act="step-delete" data-id="${s.id}" title="Remove step">×</button></li>`).join('')}</ul>
          <form class="step-add" data-form="step"><input name="title" placeholder="Add a small step…" aria-label="New step"><button class="btn btn-sm btn-ghost" type="submit">Add</button></form>
        </div>
        <div class="focus-actions">
          ${done ? `<button class="btn btn-ghost" data-act="toggle-done" data-id="${t.id}">Mark not done</button><button class="btn btn-primary" data-act="what-next">What’s next?</button>`
            : `<button class="btn btn-primary btn-lg" data-act="focus-done">${icon('check')} Done!</button>`}
          <button class="btn btn-lav" data-act="stuck">I’m stuck</button>
          <button class="btn btn-rose-soft" data-act="overwhelmed">I’m overwhelmed</button>
        </div>
      </article>
      <aside class="card timer-card">
        <h3>Focus timer <span class="small muted">(optional)</span></h3>
        <div class="timer-ring">${timerRing(rem, tm.duration)}<div class="timer-display" id="timer-display">${fmtClock(rem)}</div></div>
        <div class="row center">
          ${tm.running ? `<button class="btn btn-primary" data-act="timer-pause">${icon('pause')} Pause</button>` : `<button class="btn btn-primary" data-act="timer-start">${icon('play')} ${rem < tm.duration && rem > 0 ? 'Resume' : 'Start'}</button>`}
          <button class="icon-btn" data-act="timer-reset" title="Reset timer">${icon('reset')}</button>
        </div>
        <div class="chips center" role="group" aria-label="Timer length">${[5, 10, 15, 25, 45].map(m => `<button class="chip ${tm.duration === m * 60 ? 'on' : ''}" data-act="timer-set" data-min="${m}">${m}m</button>`).join('')}</div>
        <p class="small muted center">Switching to Break or Away pauses this automatically.</p>
      </aside>
    </div>
  </section>`;
}
const fmtClock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function timerRing(rem, dur) {
  const r = 70, c = 2 * Math.PI * r, frac = dur ? rem / dur : 0;
  return `<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle id="timer-arc" cx="80" cy="80" r="${r}" fill="none" stroke="var(--lav-deep)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - frac)).toFixed(1)}" transform="rotate(-90 80 80)"/></svg>`;
}

/* ---------------- LEADS ---------------- */
function leadsPanels() {
  const d = todayPH(), mk = UI.leadsMonth || monthKey(d), p = leadPace(d), total = monthLeads(mk);
  const min = S.settings.leadMonthlyMin, max = S.settings.leadMonthlyStretch, isCur = mk === monthKey(d);
  const work = isWorkday('sts', d), n = leadsOn(d), goal = leadGoal(d);
  const first = `${mk}-01`, pad = (dow(first) + 6) % 7, dim = daysInMonth(mk);
  let cells = '<div class="cal-head">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<span>${x}</span>`).join('') + '</div><div class="cal-grid">';
  for (let i = 0; i < pad; i++) cells += '<span class="cal-cell blank"></span>';
  for (let i = 1; i <= dim; i++) {
    const day = `${mk}-${String(i).padStart(2, '0')}`, c = leadsOn(day), g = leadGoal(day), off = isOff('sts', day), future = day > d;
    const cls = [off ? 'off' : '', !isWorkday('sts', day) && !off ? 'nonwork' : '', future ? 'future' : '', day === d ? 'today' : '', g && c >= g ? 'met' : ''].join(' ');
    cells += `<button class="cal-cell ${cls}" ${future ? 'disabled' : `data-act="lead-edit" data-date="${day}"`} aria-label="${fmtDate(day)}: ${c} leads${off ? ', day off' : ''}">
      <span class="cal-num">${i}</span>${off ? '<span class="cal-off">rest</span>' : c ? `<span class="cal-count">${c}</span>` : ''}
      ${!off && g ? `<span class="cal-dots">${Array.from({ length: g }, (_, k) => `<i class="${k < c ? 'on' : ''}"></i>`).join('')}</span>` : ''}</button>`;
  }
  cells += '</div>';
  const pct = v => Math.min(100, (v / max) * 100);
  return {
    hero: `<article class="card leads-hero" id="leads">
      <header class="card-head"><h2>Lead qualification</h2><span class="hint">STS · each lead you log blooms in the garden above</span></header>
      ${work ? `<p class="eyebrow">Today · ${n} of ${goal}</p>${leadFlowers(d, 64)}${bkTrack(d)}
        <div class="lead-actions center">
          <button class="btn btn-rose btn-lg" data-act="lead" data-delta="1">${icon('plus')} Qualified a lead</button>
          <button class="btn btn-ghost" data-act="lead" data-delta="-1" ${n ? '' : 'disabled'}>− Undo one</button>
          <button class="btn btn-ghost" data-act="lead-edit" data-date="${d}">Correct count</button>
        </div>
        <p class="small muted center">Short day? <button class="link" data-act="lead-goal">Adjust today’s goal</button> (currently ${goal})</p>`
      : `<div class="rest-note">${icon('rest')}<p>Today isn’t an STS working day — no target. If you did qualify any, you can still log them.</p></div>
        <div class="lead-actions center"><button class="btn btn-ghost" data-act="lead" data-delta="1">${icon('plus')} Log a lead anyway</button>${n ? `<span class="small">${n} logged</span>` : ''}</div>`}
    </article>`,
    month: `<div class="grid grid-2 g-leads-grid">
      <article class="card">
        <header class="card-head"><h2>Leads · ${fmtMonth(mk)}</h2>
          <div class="row"><button class="icon-btn" data-act="lead-month" data-delta="-1" aria-label="Previous month">‹</button><button class="icon-btn" data-act="lead-month" data-delta="1" aria-label="Next month" ${isCur ? 'disabled' : ''}>›</button></div></header>
        <div class="month-total"><span class="big">${total}</span><span class="muted">qualified leads</span></div>
        <div class="progress" role="img" aria-label="${total} of ${min} minimum, ${max} stretch">
          <div class="progress-fill" style="width:${pct(total)}%"></div>
          <span class="marker" style="left:${pct(min)}%"><b>${min}</b> min</span><span class="marker stretch" style="left:100%"><b>${max}</b> stretch</span>
        </div>
        ${isCur ? `<ul class="plain-list pace">
          <li>${p.days} STS working day${p.days === 1 ? '' : 's'} left (including today, days off excluded)</li>
          <li>Suggested pace for ${min}: <b>${p.min.toFixed(1)}</b> per day ${total >= min ? '— minimum reached ✿' : ''}</li>
          <li>Suggested pace for ${max}: <b>${p.stretch.toFixed(1)}</b> per day</li></ul>` : ''}
        ${total >= min ? `<p class="milestone">${icon('sparkle')} Monthly minimum reached${total >= max ? ' — and the stretch goal too!' : '.'}</p>` : ''}
      </article>
      <article class="card"><header class="card-head"><h2>Daily lead history</h2><span class="hint">tap a day to correct it</span></header>${cells}</article>
    </div>`,
  };
}

/* ---------------- GARDEN (enchanted rewards & history) ---------------- */
function V_garden() {
  const d = todayPH(), ws0 = weekStart(d), mk = monthKey(d), MAXF = 140;
  const acts = S.activity.filter(a => a.type === 'task_done' && wsOn(a.ws));
  const week = acts.filter(a => a.date >= ws0), month = acts.filter(a => a.date.startsWith(mk));
  const goldDays = Object.keys(S.top3Complete).sort();
  const leadDays = wsOn('sts') ? Object.keys(S.leads).filter(x => leadGoal(x) && leadsOn(x) >= leadGoal(x)).sort() : [];

  // Everything earned is drawn; the oldest beyond the cap become glowing meadow lights.
  const taskItems = acts.map(a => ({ key: a.id, t: magicTypeFor(a.taskId || a.id, a.ws), title: `${a.text} · ${fmtDate(a.date)}`, fresh: a.date === d }));
  const gold = goldDays.map(x => ({ key: 'g' + x, kind: 'gold', t: 6, title: `All three priorities bloomed · ${fmtDate(x)}`, fresh: x === d }));
  const lant = leadDays.map(x => ({ key: 'l' + x, kind: 'lantern', t: 7, title: `Lead goal met · ${fmtDate(x)}`, fresh: x === d }));
  const magic = Object.entries(bk().log || {}).filter(([, l]) => l >= 2).map(([x]) => x).sort().map(x => ({ key: 'k' + x, kind: 'magic', t: 4, title: `Magical lily — two leads bloomed · ${fmtDate(x)}`, fresh: x === d }));
  // One lead blossom for every qualified lead you have logged (corrections change the count honestly).
  const leadItems = wsOn('sts') ? Object.keys(S.leads).sort().flatMap(x => Array.from({ length: leadsOn(x) }, (_, i) => ({ key: `q${x}-${i}`, kind: 'lead', t: 8, title: `Qualified lead ${i + 1} · ${fmtDate(x)}`, fresh: x === d }))) : [];
  const shown = [...taskItems.slice(-MAXF), ...gold.slice(-40), ...lant.slice(-60), ...magic.slice(-60), ...leadItems.slice(-160)];
  const overflow = Math.max(0, taskItems.length - MAXF) + Math.max(0, gold.length - 40) + Math.max(0, lant.length - 60) + Math.max(0, leadItems.length - 160);
  const total = taskItems.length + gold.length + lant.length + leadItems.length;
  const LP = leadsPanels();

  const counts = MAGIC.map((_, i) => i === 6 ? gold.length : i === 7 ? lant.length : i === 8 ? leadItems.length : taskItems.filter(x => x.t === i).length);
  const legendGroup = (label, ids) => `<div class="g-legend-group"><p class="g-legend-label">${label}</p><ul>${ids.map(i => `<li class="${counts[i] ? '' : 'unearned'}">${magicMini(i, 34)}<span>${MAGIC[i].name}</span><b>${counts[i]}</b></li>`).join('')}</ul></div>`;

  const days = Array.from({ length: 7 }, (_, i) => addDays(ws0, i));
  const bed = days.map(day => {
    const list = acts.filter(a => a.date === day);
    return `<div class="g-day ${day === d ? 'today' : ''} ${day > d ? 'future' : ''}">
      <div class="g-day-blooms">${list.map((a, i) => `<span class="g-pop" style="--d:${i * 60}ms">${magicMini(magicTypeFor(a.taskId || a.id, a.ws), 30, a.text)}</span>`).join('')}${S.top3Complete[day] ? `<span class="g-pop">${magicMini(6, 34, 'All three priorities bloomed')}</span>` : ''}${wsOn('sts') ? Array.from({ length: leadsOn(day) }, (_, i) => `<span class="g-pop" style="--d:${i * 60}ms">${magicMini(8, 28, `Qualified lead ${i + 1}`)}</span>`).join('') : ''}</div>
      <div class="g-day-label">${DAY_NAMES[dow(day)]}<span>${+day.slice(8)}</span></div></div>`;
  }).join('');

  const byDate = {};
  acts.slice().reverse().forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });
  const dates = Object.keys(byDate).sort().reverse().slice(0, 21);
  const since = acts.length ? fmtDate(acts[0].date, { day: 'numeric', month: 'long', year: 'numeric' }) : null;

  return `<section class="view view-garden">
    ${gardenDefs()}
    <div class="g-hero">
      ${gardenScene(shown, overflow)}
      <div class="g-hero-text">
        <p class="eyebrow">Garden & leads</p>
        <h1>Your enchanted garden</h1>
        <p class="lede">Every task you finish and every lead you qualify blooms here — and it stays, through every break and day off.</p>
      </div>
      <p class="g-hero-foot">${total ? `${total} bloom${total === 1 ? '' : 's'} ${since ? `· tended since ${since}` : ''}${overflow ? ` · ${overflow} older blooms glow in the far meadow` : ''}` : 'A quiet garden, waiting for its first flower'}</p>
    </div>

    ${wsOn('sts') ? LP.hero : ''}

    <div class="g-stats">
      <div class="g-stat"><span class="g-num">${acts.length}</span><span>flowers grown</span></div>
      <div class="g-stat"><span class="g-num">${week.length}</span><span>this week</span></div>
      <div class="g-stat"><span class="g-num">${month.length}</span><span>this month</span></div>
      ${wsOn('sts') ? `<div class="g-stat"><span class="g-num">${monthLeads(mk)}</span><span>leads this month</span></div>` : ''}
    </div>

    ${bloomkinSection()}

    ${wsOn('sts') ? LP.month : ''}

    <article class="g-card">
      <header class="card-head"><h2>This week’s blossoms</h2><span class="hint">from Monday ${fmtDate(ws0, { day: 'numeric', month: 'short' })}</span></header>
      <div class="g-week">${bed}</div>
    </article>

    <article class="g-card">
      <header class="card-head"><h2>Flowers of the garden</h2><span class="hint">each variety marks a different kind of progress</span></header>
      <div class="g-legend">
        ${wsOn('sts') ? legendGroup('STS tasks', [0, 1, 2]) : ''}
        ${wsOn('bb') ? legendGroup('Barn & Brass tasks', [3, 4, 5]) : ''}
        ${legendGroup('Special blooms', wsOn('sts') ? [8, 6, 7] : [6])}
      </div>
      <p class="small muted">A lead blossom opens for every lead you qualify. Golden starblooms appear on days all three priorities bloomed. Lantern buds glow for each day you met your lead goal. Violet lilies bloom on days you qualified two leads.</p>
    </article>

    ${goldDays.length ? `<article class="g-card"><header class="card-head"><h2>Completed illustrations</h2><span class="hint">days all three priorities bloomed</span></header>
      <div class="gallery g-gallery">${goldDays.slice().reverse().slice(0, 12).map(day => `<figure>${top3Art([1, 1, 1])}<figcaption>${fmtDate(day)}</figcaption></figure>`).join('')}</div></article>` : ''}

    <article class="g-card">
      <header class="card-head"><h2>Garden journal</h2><span class="hint">completed tasks by day</span></header>
      ${dates.length ? dates.map(day => `<div class="log-day"><h3>${fmtDate(day, { weekday: 'long', day: 'numeric', month: 'long' })} <span class="small muted">· ${byDate[day].length}</span></h3><ul class="plain-list">${byDate[day].map(a => `<li>${magicMini(magicTypeFor(a.taskId || a.id, a.ws), 22)} ${wsTag(a.ws)} ${esc(a.text)}</li>`).join('')}</ul></div>`).join('') : '<p class="muted g-empty">Nothing here yet — your first finished task will plant the first flower.</p>'}
    </article>
  </section>`;
}


/* ---------------- REST & LEAVE ---------------- */
function V_rest() {
  const d = todayPH();
  const sorted = S.daysOff.slice().sort((a, b) => a.start.localeCompare(b.start));
  const current = sorted.filter(o => o.end >= d), past = sorted.filter(o => o.end < d).reverse();
  const row = o => `<li class="leave-row"><span class="leave-type type-${o.type}">${LEAVE_TYPES[o.type]}</span>
    <span>${o.start === o.end ? fmtDate(o.start, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : `${fmtDate(o.start)} → ${fmtDate(o.end, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}`}</span>
    ${o.ws === 'both' ? '<span class="tag">Both</span>' : wsTag(o.ws)} ${o.note ? `<span class="small muted">${esc(o.note)}</span>` : ''}
    <button class="icon-btn" data-act="leave-delete" data-id="${o.id}" title="Remove">${icon('trash')}</button></li>`;
  return `<section class="view view-rest">
    <header class="view-head"><div><p class="eyebrow">Breaks, AFK & days off</p><h1>Rest & leave</h1><p class="lede">Days off are excluded from goals. Nothing is lost, nothing is moved without asking.</p></div></header>
    <div class="grid grid-2">
      <form class="card" data-form="leave">
        <header class="card-head"><h2>Add time off</h2></header>
        <div class="form-grid">
          <label class="field"><span>From</span><input type="date" name="start" value="${d}" required></label>
          <label class="field"><span>To</span><input type="date" name="end" value="${d}" required></label>
          <label class="field"><span>Workspace</span><select name="ws"><option value="both">Both</option><option value="sts">STS only</option><option value="bb">B&amp;B only</option></select></label>
          <label class="field"><span>Type</span><select name="type">${Object.entries(LEAVE_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <label class="field"><span>Lead goal (partial days)</span><input type="number" name="goal" min="0" max="20" placeholder="e.g. 2"></label>
          <label class="field span-2"><span>Note (optional)</span><input name="note" placeholder="e.g. Family visit"></label>
        </div>
        <button class="btn btn-primary" type="submit">Save time off</button>
      </form>
      <article class="card">
        <header class="card-head"><h2>Upcoming & current</h2></header>
        ${current.length ? `<ul class="plain-list">${current.map(row).join('')}</ul>` : emptyNote('No time off planned. You’re allowed some!', false)}
        ${past.length ? `<button class="link small" data-act="toggle-ui" data-key="showPastLeave">${UI.showPastLeave ? 'Hide' : 'Show'} past (${past.length})</button>${UI.showPastLeave ? `<ul class="plain-list">${past.map(row).join('')}</ul>` : ''}` : ''}
      </article>
    </div>
    ${holidayListHTML()}
    <article class="card">
      <header class="card-head"><h2>How statuses work</h2></header>
      <ul class="plain-list explain">
        <li><b>Working</b> — normal mode.</li>
        <li><b>On Break</b> — focus timer pauses, Pip rests. Come back whenever.</li>
        <li><b>Away</b> — for AFK time. Your task, next action and timer are kept exactly as they were.</li>
        <li><b>Day Off</b> — marks today as off (for one or both workspaces). No lead target, no expectations.</li>
      </ul>
    </article>
  </section>`;
};

/* ---------------- SETTINGS ---------------- */
function V_settings() {
  const s = S.settings;
  const dayBoxes = ws => DAY_NAMES.map((n, i) => `<label class="day-box"><input type="checkbox" data-setting="${ws}Days" value="${i}" ${s[ws + 'Days'].includes(i) ? 'checked' : ''}><span>${n}</span></label>`).join('');
  const last = s.lastBackup ? `${relTime(s.lastBackup)}` : 'never';
  return `<section class="view view-settings">
    <header class="view-head"><div><p class="eyebrow">Make it yours</p><h1>Settings</h1></div></header>
    <div class="grid grid-2">
      <article class="card">

        <label class="field"><span>Repeats</span><select name="freq" id="meet-freq">${[['weekly', 'Weekly'], ['monthly', 'Monthly'], ['once', 'One-off']].map(([k, l]) => `<option value="${k}" ${d.freq === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field"><span>Time</span><input type="time" name="time" required value="${esc(d.time)}"></label>
        <label class="field"><span>Time zone</span><select name="tz"><option value="${TZ_UK}" ${d.tz === TZ_UK ? 'selected' : ''}>UK time (auto BST/GMT)</option><option value="${TZ_PH}" ${d.tz === TZ_PH ? 'selected' : ''}>PH time</option></select></label>
      </div>
      <div class="field meet-f meet-weekly" ${d.freq === 'weekly' ? '' : 'hidden'}><span>Days</span><div class="day-boxes">${DAY_NAMES.map((n, i) => `<label class="day-box"><input type="checkbox" name="days" value="${i}" ${(d.days || []).includes(i) ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div></div>
      <label class="field meet-f meet-monthly" ${d.freq === 'monthly' ? '' : 'hidden'}><span>Day of month</span><input type="number" name="dom" min="1" max="31" value="${d.dom || 1}"></label>
      <label class="field meet-f meet-once" ${d.freq === 'once' ? '' : 'hidden'}><span>Date (in the chosen time zone)</span><input type="date" name="date" value="${d.date || todayPH()}"></label>
      <label class="field"><span>Notes</span><input name="notes" value="${esc(d.notes || '')}" placeholder="Optional"></label>
      <footer class="modal-foot"><span class="spacer"></span><button type="button" class="btn btn-ghost" data-act="meet-cancel">Cancel</button><button class="btn btn-primary" type="submit">Save meeting</button></footer>
    </form>` : `<footer class="modal-foot"><button class="btn btn-primary" data-act="meet-edit" data-id="new">${icon('plus')} Add meeting</button><span class="spacer"></span><button class="btn btn-ghost" data-act="close-modal">Done</button></footer>`}`, 'modal-wide');
}
EXT_FORMS.meeting = f => {
  const fd = new FormData(f), id = fd.get('id');
  const m = { title: fd.get('title').trim(), ws: fd.get('ws'), freq: fd.get('freq'), time: fd.get('time'), tz: fd.get('tz'), notes: fd.get('notes').trim(),
    days: fd.getAll('days').map(Number), dom: clamp(+fd.get('dom') || 1, 1, 31), date: fd.get('date') || todayPH() };
  if (!m.title) return;
  if (m.freq === 'weekly' && !m.days.length) { toast('Pick at least one day'); return; }
  const ex = S.meetings.find(x => x.id === id);
  if (ex) Object.assign(ex, m); else S.meetings.push({ id: uid(), start: todayPH(), ...m });
  commit(); openMeetings(); toast('Meeting saved');
};
EXT_CHANGE.push(el => {
  if (el.id === 'meet-freq') $$('.meet-f').forEach(x => { x.hidden = !x.classList.contains('meet-' + el.value); });
});
Object.assign(EXT_ACT, {
  'meet-open': () => openMeetings(),
  'meet-edit': el => openMeetings(el.dataset.id),
  'meet-cancel': () => openMeetings(),
  'meet-del': el => {
    const i = S.meetings.findIndex(m => m.id === el.dataset.id); if (i < 0) return;
    const [m] = S.meetings.splice(i, 1); commit(); openMeetings();
    toast(`Deleted “${esc(m.title)}”`, { undo: () => { S.meetings.splice(i, 0, m); commit(); }, ms: 7000 });
  },
});

/* ---------- Links on commitments (meetings keep theirs on the meeting; routine items in S.commitLinks) ---------- */
function safeUrl(u) {
  u = String(u || '').trim(); if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  return /^(javascript|data|vbscript|file):/i.test(u) ? '' : u;
}
function linksOf(lk) {
  if (!lk) return [];
  if (lk.startsWith('meet:')) { const m = (S.meetings || []).find(x => x.id === lk.slice(5)); return m ? (m.links || []) : []; }
  return ((S.commitLinks || {})[lk]) || [];
}
function setLinks(lk, list) {
  if (lk.startsWith('meet:')) { const m = S.meetings.find(x => x.id === lk.slice(5)); if (m) m.links = list; }
  else { S.commitLinks = S.commitLinks || {}; if (list.length) S.commitLinks[lk] = list; else delete S.commitLinks[lk]; }
}
const linkHost = u => { try { return new URL(u).hostname.replace(/^www\./, '') || u; } catch (_) { return u; } };
function linkChips(lk) {
  return linksOf(lk).map(l => `<a class="cm-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" title="${esc(l.url)}">${icon('arrow')}${esc(l.label || linkHost(l.url))}</a>`).join('');
}
function openLinks(lk, title) {
  const list = linksOf(lk);
  openModal(`${modalHead('Links', esc(title))}
    <ul class="plain-list link-list">${list.map((l, i) => `<li class="meet-row"><div class="meet-main"><b>${esc(l.label || linkHost(l.url))}</b><a class="small" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a></div>
      <button class="icon-btn" data-act="link-del" data-lk="${esc(lk)}" data-i="${i}" data-title="${esc(title)}" title="Remove link" aria-label="Remove link">${icon('trash')}</button></li>`).join('') || '<li class="muted small">No links yet.</li>'}</ul>
    <form data-form="link" class="meet-form"><input type="hidden" name="lk" value="${esc(lk)}"><input type="hidden" name="title" value="${esc(title)}">
      <div class="form-grid">
        <label class="field span-2"><span>Link</span><input name="url" required placeholder="Paste a meeting, file or page link" autofocus></label>
        <label class="field span-2"><span>Name (optional)</span><input name="label" maxlength="40" placeholder="e.g. Join call, Slides"></label>
      </div>
      <footer class="modal-foot"><span class="spacer"></span><button type="button" class="btn btn-ghost" data-act="close-modal">Done</button><button class="btn btn-primary" type="submit">${icon('plus')} Add link</button></footer>
    </form>`);
}
EXT_FORMS.link = f => {
  const fd = new FormData(f), lk = fd.get('lk'), url = safeUrl(fd.get('url'));
  if (!url) { toast('That link can’t be used — try a web address'); return; }
  setLinks(lk, [...linksOf(lk), { url, label: fd.get('label').trim() }]);
  commit(); openLinks(lk, fd.get('title')); toast('Link added');
};
Object.assign(EXT_ACT, {
  'link-open': el => openLinks(el.dataset.lk, el.dataset.title),
  'link-del': el => { const lk = el.dataset.lk, list = linksOf(lk).slice(); list.splice(+el.dataset.i, 1); setLinks(lk, list); commit(); openLinks(lk, el.dataset.title); },
});

</script>
  <script>
'use strict';
/* =========================================================
   STS CONTENT PLANNER — modelled on the monthly Excel matrix:
   Month | Topic | Content Type | Whale | Owner | Large | Owner | … | Micro | Owner
   One item = month + content type + publishing account + brief,
   with one or more customer segments (each with owner & status).
   ========================================================= */

const C_TYPES = {
  email: { label: 'Email campaign / e-shot', short: 'Email', cat: 'Email & newsletters' },
  social: { label: 'Social media', short: 'Social', cat: 'Social media & LinkedIn' },
  blog: { label: 'Blog', short: 'Blog', cat: 'Blogs, SEO & Knowledge Base' },
  kb: { label: 'Knowledge Base article', short: 'KB article', cat: 'Blogs, SEO & Knowledge Base' },
  signature: { label: 'Email signature', short: 'Signature', cat: 'Email & newsletters' },
  other: { label: 'Other marketing material', short: 'Other', cat: 'Sales resources & presentations' },
};
const C_STATUS = ['notstarted', 'drafting', 'review', 'changes', 'approved', 'scheduled', 'published'];
const C_STATUS_L = { notstarted: 'Not Started', drafting: 'Drafting', review: 'Sent for Review', changes: 'Changes Requested', approved: 'Approved', scheduled: 'Scheduled', published: 'Published' };
/* Publishing accounts live in your saved settings (not in the code). First run: built from accounts already used. */
function accounts() {
  const s = S.settings;
  if (!Array.isArray(s.contentAccounts)) s.contentAccounts = ["STS Page", ...new Set((S.content || []).map(c => c.account).filter(a => a && a !== "STS Page"))];
  return s.contentAccounts;
}
EXT_CHANGE.push(el => { if (!el.matches("[data-accounts]")) return; const list = el.value.split(",").map(a => a.trim()).filter(Boolean); S.settings.contentAccounts = [...new Set(["STS Page", ...list.filter(a => a !== "STS Page")])]; commit(); toast("Publishing accounts saved"); });
const SEGMENTS = ['Whale', 'Large', 'Medium', 'Small', 'Micro'];
const TASK_FOR = { notstarted: null, drafting: 'doing', review: 'waiting', changes: 'doing', approved: 'doing', scheduled: 'doing', published: 'done' };
Object.assign(UI, { cMonth: 'all', cType: 'all', cAcct: 'all', cSeg: 'all', cStatus: 'active', cQ: '' });

/* ---------- model (+ upgrade of items saved by the previous planner) ---------- */
function upgradeContent() {
  let changed = false;
  (S.content || []).slice().forEach(c => {
    if (c.v2) return;
    changed = true;
    const auds = c.audiences || [], vers = c.versions || {};
    Object.assign(c, { month: c.month || '', topic: c.topic || '', contentTypeRaw: c.contentTypeRaw || '', account: '', segments: [], versions: {} });
    if (c.type === 'email') auds.filter(a => SEGMENTS.includes(a)).forEach(s => { c.segments.push(s); c.versions[s] = { owner: '', link: '', notes: '', ...(vers[s] || {}), status: (vers[s] || {}).status || 'notstarted' }; });
    else if (c.type === 'social' && auds.length) {
      const acc = a => a === 'STS Company Page' ? 'STS Page' : a;
      c.account = acc(auds[0]); c.status = (vers[auds[0]] || {}).status || c.status || 'notstarted';
      auds.slice(1).forEach(a => { // one item per publishing account
        S.content.push({ ...c, id: uid(), account: acc(a), status: (vers[a] || {}).status || 'notstarted', taskId: null, segments: [], versions: {}, history: [{ at: nowISO(), text: `Split from “${c.title}” (one item per account)` }], v2: true });
      });
    }
    delete c.audiences; c.v2 = true;
  });
  if (changed) { S.content.filter(c => !c.deletedAt).forEach(c => syncContent(c, null, true)); save(); }
}
const liveContent = () => { upgradeContent(); return (S.content || []).filter(c => !c.deletedAt); };
const getContent = id => { upgradeContent(); return (S.content || []).find(c => c.id === id); };
function contentOverall(c) {
  if (c.segments && c.segments.length) return C_STATUS[Math.min(...c.segments.map(s => C_STATUS.indexOf((c.versions[s] || {}).status || 'notstarted')))];
  return c.status || 'notstarted';
}
function cHist(c, text) { (c.history = c.history || []).push({ at: nowISO(), text }); }
const firstLine = s => String(s || '').split('\n').map(x => x.trim()).find(Boolean) || '';
const shortTitle = s => { const f = firstLine(s); return f.length > 90 ? f.slice(0, 88) + '…' : f; };
const cLabel = c => `${C_TYPES[c.type].short}${c.account ? ' · ' + c.account : ''}`;

function createContent(d) {
  const c = {
    id: uid(), v2: true, month: d.month || '', topic: d.topic || '', contentTypeRaw: d.contentTypeRaw || '', type: d.type || 'other', account: d.account || '',
    title: d.title || shortTitle(d.brief), brief: d.brief || '', segments: [], versions: {}, status: d.status || 'notstarted',
    due: d.due || null, publish: d.publish || null, priority: d.priority || 'med', notes: d.notes || '', links: d.links || [],
    taskId: null, createdAt: nowISO(), history: [], source: d.source || 'manual',
  };
  (d.segments || []).forEach(s => addSegment(c, s.name || s, s.owner || '', d.status));
  cHist(c, d.source === 'import' ? `Imported${d.origin ? ' from ' + d.origin : ''}` : 'Created');
  S.content.push(c);
  syncContent(c, null, true);
  return c;
}
function addSegment(c, seg, owner = '', status) {
  if (!c.segments.includes(seg)) c.segments.push(seg);
  c.versions[seg] = c.versions[seg] || { status: status || 'notstarted', owner: '', link: '', notes: '', sentAt: status === 'review' ? nowISO() : null };
  if (owner) c.versions[seg].owner = owner;
  c.segments.sort((a, b) => SEGMENTS.indexOf(a) - SEGMENTS.indexOf(b));
}

/** Keeps one linked STS task per dated item, in step with its status. */
function syncContent(c, el, quiet) {
  if (c.deletedAt) return;
  let t = c.taskId && getTask(c.taskId);
  if (!t || t.deletedAt) t = liveTasks().find(x => x.contentId === c.id) || null;
  const due = c.due || c.publish || null, ov = contentOverall(c), title = `${cLabel(c)}: ${c.title}`;
  if (!t && due && ov !== 'published') {
    t = createTask({ ws: 'sts', title, due, category: C_TYPES[c.type].cat, priority: c.priority, notes: c.brief });
    t.contentId = c.id; addHistory(t, 'Linked to Content Planner');
  }
  if (t) {
    c.taskId = t.id;
    if (t.status !== 'done') { if (due && t.due !== due) setDue(t, due, 'Synced from Content Planner'); t.title = title; }
    const want = TASK_FOR[ov];
    if (want === 'done') { if (t.status !== 'done') { if (quiet) setTaskStatus(t, 'done'); else completeTask(t, el); } }
    else if (want && t.status !== 'done' && t.status !== want) setTaskStatus(t, want);
  } else {
    const has = S.activity.some(a => a.taskId === c.id && a.type === 'task_done');
    if (ov === 'published' && !has) { logActivity('task_done', 'sts', `Published: ${c.title}`, c.id); if (!quiet) { const [x, y] = centerOf(el); burst(x, y); Pip.set('celebrate', 'Published! A new bloom for your garden.'); } }
    if (ov !== 'published' && has) S.activity = S.activity.filter(a => !(a.taskId === c.id && a.type === 'task_done'));
  }
}
const isSocial = c => c.type === 'social' || normType(c.contentTypeRaw) === 'social';
function setContentStatus(c, seg, status, el) {
  const before = contentOverall(c);
  const v = seg ? (c.versions[seg] = c.versions[seg] || { status: 'notstarted' }) : c;
  const prevS = v.status || 'notstarted';
  v.status = status; if (status === 'review') v.sentAt = nowISO(); if (status === 'approved') v.approvedAt = nowISO();
  cHist(c, `${seg ? seg + ': ' : ''}${C_STATUS_L[status]}`);
  const after = contentOverall(c);
  syncContent(c, el, before === after);
  if (status === 'approved') Pip.set('celebrate', 'Approved! Lovely work.', 3500);
  if (isSocial(c) && status === 'published' && prevS !== 'published' && el && S.settings.socialReminder !== false) setTimeout(() => openPublishReminder(c, seg), 700);
}

/* ---------- approvals + Today summary ---------- */
function pendingApprovals() {
  const out = [];
  liveContent().forEach(c => {
    const add = (seg, v) => { if (v.status === 'review' || v.status === 'changes') out.push({ c, seg, status: v.status, days: v.sentAt ? diffDays(dateIn(TZ_PH, new Date(v.sentAt)), todayPH()) : 0 }); };
    if (c.segments.length) c.segments.forEach(s => add(s, c.versions[s] || {})); else add(null, c);
  });
  return out.sort((a, b) => b.days - a.days);
}
function contentCommitment() {
  const p = pendingApprovals().filter(x => x.status === 'review');
  const mName = fmtMonth(monthKey(todayPH())).split(' ')[0].toLowerCase();
  const todo = liveContent().filter(c => c.month.toLowerCase().includes(mName) && contentOverall(c) === 'notstarted').length;
  if (!p.length && !todo) return null;
  const f = p.filter(x => x.days >= 3).length;
  return {
    text: [p.length ? `${p.length} content draft${p.length > 1 ? 's' : ''} waiting for review` : '', todo ? `${todo} piece${todo > 1 ? 's' : ''} of this month’s content not started` : ''].filter(Boolean).join(' · '),
    sub: `${f ? `${f} sent 3+ days ago — maybe a gentle follow-up · ` : ''}<a href="#content">Open planner</a>`,
  };
}

/* ---------- planner view ---------- */
const statusSelect = (val, attrs) => `<select class="c-select st-${val}" ${attrs}>${C_STATUS.map(s => `<option value="${s}" ${s === val ? 'selected' : ''}>${C_STATUS_L[s]}</option>`).join('')}</select>`;
const opt = (v, cur, label = v) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
function contentRow(c) {
  const ov = contentOverall(c), d = todayPH(), late = c.due && c.due < d && !['scheduled', 'published'].includes(ov);
  const segs = c.segments.length ? c.segments.filter(s => UI.cSeg === 'all' || s === UI.cSeg) : [];
  const brief = esc(c.brief || c.title).replace(/\n/g, '<br>');
  return `<tr class="c-row type-${c.type} ${ov === 'published' ? 'is-pub' : ''}">
    <td data-l="Month">${esc(c.month) || '<span class="muted">—</span>'}</td>
    <td data-l="Type"><span class="c-type">${C_TYPES[c.type].short}</span>${c.contentTypeRaw && c.contentTypeRaw.toLowerCase() !== C_TYPES[c.type].short.toLowerCase() ? `<div class="small muted">${esc(c.contentTypeRaw)}</div>` : ''}</td>
    <td data-l="Account">${c.account ? `<span class="c-acct">${esc(c.account)}</span>` : '<span class="muted">—</span>'}</td>
    <td data-l="Topic / brief" class="c-brief-cell"><div class="c-brief-full" data-act="content-edit" data-id="${c.id}" role="button" tabindex="0">${brief}</div>${taskChip(c)}
      <div class="small muted">${c.topic ? `Topic: ${esc(c.topic)}` : ''}${c.due ? ` <span class="${late ? 'due-past' : ''}">· due ${fmtDate(c.due)}</span>` : ''}${c.publish ? ` · publish ${fmtDate(c.publish)}` : ''}</div></td>
    <td data-l="Segment · owner · status"><ul class="c-segs">${segs.length ? segs.map(s => { const v = c.versions[s] || {}; return `<li><span class="c-seg seg-${s.toLowerCase()}">${s}</span><span class="c-owner">${v.owner ? esc(v.owner) : '<span class="muted">no owner</span>'}</span>${statusSelect(v.status || 'notstarted', `data-cfield="status" data-id="${c.id}" data-seg="${s}" aria-label="${s} status"`)}</li>`; }).join('')
      : `<li><span class="muted small">No segment</span><span></span>${statusSelect(c.status || 'notstarted', `data-cfield="status" data-id="${c.id}" aria-label="Status"`)}</li>`}</ul></td>
    <td class="c-actions">${contentActions(c)}<button class="icon-btn" data-act="content-edit" data-id="${c.id}" title="Edit">${icon('edit')}</button><button class="icon-btn" data-act="content-delete" data-id="${c.id}" title="Delete">${icon('trash')}</button></td>
  </tr>`;
}
function V_content() {
  if (S.settings.wsFilter === 'bb') return `<section class="view"><header class="view-head"><div><p class="eyebrow">STS</p><h1>Content planner</h1></div></header><div class="card">${emptyNote('The Content Planner belongs to STS. Switch the top bar to “Both” or “STS” to see it.')}</div></section>`;
  const all = liveContent(), q = UI.cQ.toLowerCase();
  const months = [...new Set(all.map(c => c.month).filter(Boolean))];
  const list = all.filter(c => {
    const ov = contentOverall(c);
    if (UI.cMonth !== 'all' && c.month !== UI.cMonth) return false;
    if (UI.cType !== 'all' && c.type !== UI.cType) return false;
    if (UI.cAcct !== 'all' && (UI.cAcct === 'none' ? c.account : c.account !== UI.cAcct)) return false;
    if (UI.cSeg !== 'all' && !c.segments.includes(UI.cSeg)) return false;
    if (UI.cStatus === 'active' && ov === 'published') return false;
    if (UI.cStatus === 'published' && ov !== 'published') return false;
    if (UI.cStatus === 'review' && !pendingApprovals().some(p => p.c === c)) return false;
    return !q || [c.title, c.brief, c.topic, c.notes, c.contentTypeRaw, c.account, ...c.segments.map(s => (c.versions[s] || {}).owner)].join(' ').toLowerCase().includes(q);
  }).sort((a, b) => months.indexOf(a.month) - months.indexOf(b.month) || Object.keys(C_TYPES).indexOf(a.type) - Object.keys(C_TYPES).indexOf(b.type) || a.account.localeCompare(b.account));
  const pend = pendingApprovals();
  const chip = (val, label) => `<button class="chip ${UI.cStatus === val ? 'on' : ''}" data-act="c-filter" data-key="cStatus" data-val="${val}">${label}</button>`;
  const sel = (key, label, opts) => `<label class="c-filter"><span>${label}</span><select data-cfilter="${key}">${opt('all', UI[key], 'All')}${opts}</select></label>`;
  return `<section class="view view-content">
    <header class="view-head"><div><p class="eyebrow">STS</p><h1>Content planner</h1><p class="lede">Monthly content matrix — one gentle step at a time.</p></div>
      <div class="row"><button class="btn btn-ghost" data-act="content-import">${icon('upload')} Import plan</button><button class="btn btn-primary" data-act="content-new">${icon('plus')} New content</button></div></header>
    <article class="card c-approvals">
      <header class="card-head"><h2>Approvals</h2><span class="hint">${pend.length ? `${pend.length} waiting` : 'nothing waiting'}</span></header>
      ${pend.length ? `<ul class="plain-list">${pend.slice(0, 8).map(p => `<li class="${p.status === 'review' && p.days >= 3 ? 'follow' : ''}"><span class="c-pill st-${p.status}">${C_STATUS_L[p.status]}</span><button class="link" data-act="content-edit" data-id="${p.c.id}">${esc(p.c.title)}</button><span class="tag">${esc(cLabel(p.c))}${p.seg ? ' · ' + p.seg : ''}</span><span class="small muted">${p.status === 'review' ? (p.days ? `sent ${p.days} day${p.days > 1 ? 's' : ''} ago` : 'sent today') : 'edits to make'}${p.status === 'review' && p.days >= 3 ? ' · follow up?' : ''}</span></li>`).join('')}</ul>` : '<p class="small muted">When a segment is “Sent for Review”, it appears here; dated items’ tasks show as Waiting for Approval.</p>'}
    </article>
    <div class="toolbar card">
      <div class="c-filters">
        ${sel('cMonth', 'Month', months.map(m => opt(m, UI.cMonth)).join(''))}
        ${sel('cType', 'Content type', Object.entries(C_TYPES).map(([k, v]) => opt(k, UI.cType, v.short)).join(''))}
        ${sel('cAcct', 'Account', accounts().map(a => opt(a, UI.cAcct)).join('') + opt('none', UI.cAcct, 'No account'))}
        ${sel('cSeg', 'Segment', SEGMENTS.map(s => opt(s, UI.cSeg)).join(''))}
        <label class="search">${icon('sparkle')}<input type="search" id="content-search" placeholder="Search briefs, owners…" value="${esc(UI.cQ)}" aria-label="Search content"></label>
      </div>
      <div class="chips" role="group" aria-label="Status">${chip('active', 'In progress')}${chip('review', 'In review')}${chip('published', 'Published')}${chip('all', 'All')}</div>

  if (named) return named;

async function readZip(buf) {

    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);

    p += 46 + nl + xl + cl;

    const data = new Uint8Array(buf, f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true), f.size);
    if (f.method === 0) return td.decode(data);
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser can’t open .xlsx files — please update Safari/Chrome, or use the ChatGPT JSON method.');

  <script>
'use strict';
/* =========================================================
   FINANCE — GBP/USD/CNY → PHP from European Central Bank
   reference rates via the free Frankfurter API. Read-only.
   ========================================================= */

const FX_KEY = 'productivityApp.fx';
const FX_CUR = { GBP: 'British pound', USD: 'US dollar', CNY: 'Chinese yuan' };
const FX_FLAG = { GBP: '£', USD: '$', CNY: '¥' };
let FX = null, fxState = 'idle', fxMsg = '';
Object.assign(UI, { fxCur: 'GBP', fxRange: 30, fxAmt: 100, fxFrom: 'GBP' });
try { FX = JSON.parse(localStorage.getItem(FX_KEY) || 'null'); } catch (_) {}

async function fxFetch() {
  fxState = 'loading'; if (['finance', 'today'].includes(currentView()) && !$('#modal-root').innerHTML) render();
  const start = addDays(todayPH(), -130), syms = 'GBP,USD,CNY,PHP';
  const urls = [
    `https://api.frankfurter.dev/v1/${start}..?base=EUR&symbols=${syms}`,
    `https://api.frankfurter.app/${start}..?from=EUR&to=${syms}`,
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      if (j && j.rates && Object.keys(j.rates).length) {
        FX = { fetchedAt: Date.now(), source: u.split('/')[2], rates: j.rates };
        try { localStorage.setItem(FX_KEY, JSON.stringify(FX)); } catch (_) {}
        fxState = 'ok'; fxMsg = ''; checkFxTargets(true);
        if (['finance', 'today'].includes(currentView()) && !$('#modal-root').innerHTML) render();
        return;
      }
    } catch (_) {}
  }
  fxState = 'error';
  fxMsg = navigator.onLine === false ? 'You’re offline.' : 'Couldn’t reach the rates service.';
  if (['finance', 'today'].includes(currentView()) && !$('#modal-root').innerHTML) render();
}
EXT_INIT.push(() => { if (!FX || Date.now() - FX.fetchedAt > 3 * 3600e3) fxFetch(); });

/** [{date, rate}] for CUR → PHP, oldest first (only real published days). */
function fxSeries(cur) {
  if (!FX) return [];
  return Object.keys(FX.rates).sort().map(d => { const r = FX.rates[d]; return r && r.PHP && r[cur] ? { date: d, rate: r.PHP / r[cur] } : null; }).filter(Boolean);
}
const fxFmt = (n, dp = 4) => n == null || isNaN(n) ? '—' : n.toLocaleString('en-GB', { minimumFractionDigits: dp, maximumFractionDigits: dp });
function fxTargetHit(cur, rate) { const t = S.settings.fxTargets[cur]; if (!t || !t.rate || rate == null) return false; return t.dir === 'below' ? rate <= t.rate : rate >= t.rate; }
function checkFxTargets(notify) {
  Object.keys(FX_CUR).forEach(cur => {
    const s = fxSeries(cur), last = s[s.length - 1], t = S.settings.fxTargets[cur];
    if (!last || !t) return;
    if (fxTargetHit(cur, last.rate) && t.notifiedFor !== last.date) { t.notifiedFor = last.date; save(); if (notify) toast(`${cur} → PHP target reached: ${fxFmt(last.rate)} ✿`, { ms: 7000 }); }
  });
}

function fxChart(cur, days) {
  const all = fxSeries(cur); if (all.length < 2) return '<p class="muted small">Not enough data yet.</p>';
  const from = addDays(all[all.length - 1].date, -days), pts = all.filter(p => p.date >= from);
  const W = 640, H = 230, L = 52, R = 14, T = 16, B = 30;
  const t = S.settings.fxTargets[cur], vals = pts.map(p => p.rate).concat(t && t.rate ? [t.rate] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .12 || hi * .002; lo -= pad; hi += pad;
  const x = i => L + (i / (pts.length - 1)) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.rate).toFixed(1)}`).join('');
  const ticks = [0, .5, 1].map(f => lo + (hi - lo) * f);
  const first = pts[0].rate, last = pts[pts.length - 1].rate, chg = ((last - first) / first) * 100;
  return `<svg class="fx-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${cur} to PHP over ${days} days: from ${fxFmt(first)} to ${fxFmt(last)} (${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%)">
    <defs><linearGradient id="fxFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a593d6" stop-opacity=".35"/><stop offset="1" stop-color="#a593d6" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#e2d8f0"/><text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="fx-ax">${fxFmt(v, 2)}</text>`).join('')}

    <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4.5" fill="#6a54a6" stroke="#fff" stroke-width="2"/>

    <text x="${W - R}" y="${H - 8}" text-anchor="end" class="fx-ax">${fmtDate(pts[pts.length - 1].date, { day: 'numeric', month: 'short' })}</text>
  </svg>

}

        <input name="rate" type="number" step="0.0001" min="0" value="${t.rate || ''}" placeholder="Target" aria-label="${cur} target rate"><button class="btn btn-sm btn-ghost" type="submit">Save</button></form>

  const amt = +UI.fxAmt || 0, php = last ? amt * last.rate : null;

  return `<section class="view view-finance">

      <button class="btn btn-ghost" data-act="fx-refresh" ${fxState === 'loading' ? 'disabled' : ''}>${icon('reset')} Refresh rates</button></header>
    ${status ? `<div class="banner ${fxState === 'error' ? 'banner-rest' : 'banner-pause'}">${icon('clock')} <span>${status}</span></div>` : ''}

        <header class="card-head"><h2>${UI.fxCur} → PHP history</h2><div class="chips">${[7, 30, 90].map(n => `<button class="chip ${UI.fxRange === n ? 'on' : ''}" data-act="fx-range" data-n="${n}">${n} days</button>`).join('')}</div></header>

/* ---------- state ---------- */
function bk() {
  if (!S.bloomkin) S.bloomkin = { unlocked: {}, wear: { hair: null, outfit: null, acc: null }, placed: {}, log: {}, l4: 0, maxStage: 0 };
  return S.bloomkin;
}
const lifetimeLeads = () => Object.values(S.leads).reduce((a, n) => a + (+n || 0), 0);
function bkStage() {
  const B = bk(), n = lifetimeLeads(); let s = 0;
  BK_STAGES.forEach((st, i) => { if (n >= st.min) s = i; });
  return Math.max(s, B.maxStage || 0); // growth is permanent
}

</script>
  <script>
'use strict';
/* =========================================================
   SYNC — keeps Mac and phone in step through ONE secret
   GitHub gist (file "mahika-sync.json") on your own account.
   - Your key (token) stays in this browser only: never in
     the gist, in backups, or in the code.
   - Pulls when the app opens / comes back to the front;
     pushes a few seconds after a real change.
   - If both devices changed, it asks — nothing is silently lost
     (the replaced copy is kept aside in this browser).
   ========================================================= */
const SYNC_KEY = 'productivityApp.sync', SYNC_FILE = 'mahika-sync.json', GH = 'https://api.github.com';
const Sync = {
  meta: (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (_) { return {}; } })(),
  busy: false, again: false, timer: null, status: '',
  on() { return !!(this.meta.token && this.meta.gistId); },
  keep() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(this.meta)); } catch (_) {} },
  body(st) { const { lastSeen, ...rest } = st; return JSON.stringify(rest); },
  hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + ':' + str.length; },
  async api(path, opts = {}) {
    const r = await fetch(GH + path, { ...opts, headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + this.meta.token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, cache: 'no-store' });
    if (r.status === 401 || r.status === 403) throw Object.assign(new Error('key'), { code: 'key' });
    if (r.status === 404) throw Object.assign(new Error('gone'), { code: 'gone' });
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  },
  async readGist() {
    const g = await this.api('/gists/' + this.meta.gistId), f = g.files[SYNC_FILE];
    if (!f) throw Object.assign(new Error('gone'), { code: 'gone' });
    const text = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
    return migrate(JSON.parse(text));
  },
  async push() {
    const text = JSON.stringify(S);
    await this.api('/gists/' + this.meta.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [SYNC_FILE]: { content: text } } }) });
    this.meta.base = this.hash(this.body(S)); this.done();
  },
  apply(remote) {
    try { localStorage.setItem(STORE_KEY + '.before-sync', JSON.stringify(S)); } catch (_) {} // one rolling safety copy
    const seen = S.lastSeen; S = remote; S.lastSeen = seen;
    this.meta.base = this.hash(this.body(S)); quietSave = true; save(); quietSave = false;
    this.done(); render(); if (typeof bkRefresh === 'function') bkRefresh();
  },
  done() { this.meta.lastSync = nowISO(); this.status = ''; this.keep(); this.paint(); },
  fail(e) {
    this.status = e.code === 'key' ? 'Your sync key isn’t working — check it in Settings.' : e.code === 'gone' ? 'The sync file wasn’t found — reconnect in Settings.' : 'Offline — will sync when you’re back online.';
    this.paint();
  },
  /* Compare this device, the gist, and the last copy both agreed on. */
  async run() {
    if (!this.on()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      const remote = await this.readGist();
      const L = this.hash(this.body(S)), R = this.hash(this.body(remote)), B = this.meta.base;
      if (L === R) { this.meta.base = L; this.done(); }
      else if (R === B) await this.push();          // only this device changed
      else if (L === B) { if ($('#modal-root').innerHTML) this.soon(15000); else this.apply(remote); } // only the other device changed (wait if a window is open)
      else this.ask(remote);                        // both changed (or first connect)
    } catch (e) { this.fail(e); }
    this.busy = false;
    if (this.again) { this.again = false; this.run(); }
  },
  soon(ms = 4000) { if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  ask(remote) {
    Sync.pending = remote;
    const n = st => (st.tasks || []).filter(t => !t.deletedAt).length, first = !this.meta.base;
    openModal(`${modalHead(first ? 'Which data should this device use?' : 'Both devices have changes')}
      <p>${first ? 'Synced data from your other device was found.' : 'This device and your other device were both changed since they last synced.'}</p>
      <p class="small muted">Synced copy: ${n(remote)} tasks · This device: ${n(S)} tasks. The copy you don’t pick is kept aside in this browser, so nothing is lost.</p>
      <footer class="modal-foot"><span class="spacer"></span>
        <button class="btn btn-ghost" data-act="sync-keep-local">Keep this device’s</button>
        <button class="btn btn-primary" data-act="sync-use-remote">Use the synced copy</button></footer>`);
  },
  paint() {
    const n = $('#save-note'); if (n && this.on() && !this.status) n.textContent = 'Saved · synced';
    const c = $('#sync-status'); if (c) c.innerHTML = syncStatusText();
  },
};
function syncStatusText() {
  if (!Sync.on()) return 'Not connected — this device keeps its own data.';
  if (Sync.status) return `<span class="sync-warn">${esc(Sync.status)}</span>`;
  return Sync.meta.lastSync ? `Connected · last synced ${relTime(Sync.meta.lastSync)}` : 'Connected';
}

/* Hook into every save: queue a sync only when real data changed (not the minute heartbeat). */
{
  const localSave = save;
  save = function () { localSave(); if (Sync.on() && Sync.hash(Sync.body(S)) !== Sync.meta.base) Sync.soon(); };
}

/* ---------- Settings card ---------- */
function syncCard() {
  const on = Sync.on();
  return `<article class="card card-sync">
    <header class="card-head"><h2>${icon('reset')} Sync Mac & phone</h2></header>
    <p class="small" id="sync-status">${syncStatusText()}</p>
    ${on ? `<div class="row"><button class="btn btn-primary btn-sm" data-act="sync-now">Sync now</button><button class="btn btn-ghost btn-sm" data-act="sync-off">Disconnect this device</button></div>`
    : `<p class="small muted">Paste your GitHub sync key (a token with only <b>Gists</b> access). Use the same key on each device. Your data goes into one secret gist on your GitHub; the key stays in this browser only.</p>
    <form class="row" data-form="sync-connect"><input type="password" name="token" placeholder="github_pat_…" autocomplete="off" required style="flex:1;min-width:0"><button class="btn btn-primary btn-sm">Connect</button></form>`}

EXT_FORMS['sync-connect'] = async f => {

Object.assign(EXT_ACT, {

  <script>

const reduced = () => S.settings.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches;
const currentView = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : 'today'; };
