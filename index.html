function commit() { save(); render(); }

/* ---------- rendering ---------- */
let lastView = null;
function render() {
  const v = currentView();
  if (typeof Drafts !== 'undefined') Drafts.capture();
  $('#view').innerHTML = VIEWS[v]();
  if (typeof Drafts !== 'undefined') Drafts.restore($('#view'));

}
function renderChrome() {
  if (typeof renderBkSide === 'function') renderBkSide();
  const v = currentView(), inboxN = S.inbox.filter(i => !i.processed).length;
  $('#nav').innerHTML = NAV.map(([key, label, ic]) => `<a href="#${key}" class="nav-item ${v === key ? 'active' : ''}" ${v === key ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span>${key === 'dump' && inboxN ? `<em class="count">${inboxN}</em>` : ''}</a>`).join('');
  $('#ws-switch').innerHTML = [['all', 'Both'], ['sts', 'STS'], ['bb', 'B&B']].map(([k, l]) => `<button class="seg ${S.settings.wsFilter === k ? 'on' : ''} seg-${k}" data-act="ws-filter" data-ws="${k}" aria-pressed="${S.settings.wsFilter === k}">${l}</button>`).join('');
  $('#status-switch').innerHTML = Object.entries(MODES).map(([k, l]) => `<button class="status-btn st-${k} ${S.status.mode === k ? 'on' : ''}" data-act="set-mode" data-mode="${k}" aria-pressed="${S.status.mode === k}"><i></i>${l}</button>`).join('');

}
function renderClocks() {

  const st = !work ? 'No STS hours today' : h < 13 ? `STS starts in ${Math.floor(toGo / 60)}h ${toGo % 60}m` : h < 22 ? `STS · ${Math.floor(left / 60)}h ${left % 60}m left` : 'STS day finished';
  const on = work && h >= 13 && h < 22, uk = tzOffsetMin(TZ_UK, now) === 60 ? 'BST' : 'GMT';
  $('#clocks').innerHTML = `<span class="ck"><b>PH</b><span class="ck-t">${fmtTime(now, TZ_PH)}</span></span><span class="ck-sep" aria-hidden="true"></span><span class="ck"><b>UK</b><span class="ck-t">${fmtTime(now, TZ_UK)}</span><i>${uk}</i></span><span class="ck-st ${on ? 'on' : ''}">${st}</span>`;
  if (typeof fillTodayClock === 'function') fillTodayClock(now);
}

/* ---------- save indicator ---------- */
let quietSave = false, saveNoteTimer;
onSaved = ok => {
  if (quietSave) return;
  const n = $('#save-note'); if (!n) return;
  n.textContent = ok ? 'All changes saved' : 'Couldn’t save — download a backup';
  n.classList.toggle('error', !ok); n.classList.add('flash');
  clearTimeout(saveNoteTimer); saveNoteTimer = setTimeout(() => n.classList.remove('flash'), 900);
};

/* ---------- companion ---------- */
const Pip = {
  t: null, bt: null,
  base() { if (S.status.mode !== 'working') return 'rest'; return S.focus.timer.running ? 'working' : 'idle'; },
  set(state, msg, ms = 5200) {

    if (msg) this.say(msg, ms);
  },
  reset() { $('#companion').className = 'companion state-' + this.base(); },
  say(msg, ms = 5200) {

    clearTimeout(this.bt); this.bt = setTimeout(() => b.classList.remove('show'), ms);

/* ---------- toasts & celebrations ---------- */
function toast(msg, { art = '', undo = null, ms = 4200 } = {}) {
  const el = document.createElement('div');

  el.innerHTML = `${art ? `<span class="toast-art">${art}</span>` : ''}<span class="toast-msg">${msg}</span>${undo ? '<button class="link">Undo</button>' : ''}`;

}
function burst(x, y, count = 14) {
  if (reduced() || x == null) return;
  const colors = ['#e6b3ab', '#c6b8e0', '#f4dc8f', '#9caf88', '#f2c9bf', '#fffaf0'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span'), a = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 80;

/* ---------- task completion ---------- */
function completeTask(t, el) {

/* ---------- modals ---------- */

/* Backup */
function exportData() {
  S.settings.lastBackup = nowISO(); save();
  const blob = new Blob([JSON.stringify({ app: 'Mahika Productivity App', exportedAt: nowISO(), state: S }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `mahika-productivity-backup-${todayPH()}.json`;

}
function handleImport(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result), st = data.state || data;
      if (!Array.isArray(st.tasks)) throw new Error('bad');
      M.importState = st;
      openModal(`${modalHead('Restore this backup?')}
        <p>Backup from <b>${data.exportedAt ? new Date(data.exportedAt).toLocaleString('en-GB') : 'unknown date'}</b> with ${st.tasks.length} tasks.</p>
        <p class="small muted">This replaces what’s in the app now. A safety copy of your current data is kept in the browser first.</p>
        <footer class="modal-foot"><span class="spacer"></span><button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" data-act="import-confirm">Restore</button></footer>`);
    } catch (e) { toast('That file doesn’t look like a Mahika backup.'); }
  };
  r.readAsText(file);
}

function setMode(mode) {
  const prev = S.status.mode, d = todayPH();
  if (prev === mode) return;
  if (mode === 'off') { openDayOff(); return; }
  if (prev === 'off') {
    // Undo a same-day "Day Off" toggle for both workspaces (planned leave is left alone).
    S.daysOff = S.daysOff.filter(o => !(o.auto && o.ws === 'both' && o.start === d && o.end === d));
  }
  S.status = { mode, since: Date.now(), prev };
  if (mode !== 'working') pauseTimer();
  commit();
  if (mode === 'break') Pip.set('rest', pick(LINES.rest), 5000);
  else if (mode === 'away') Pip.set('rest', 'I’ll keep your place exactly as it is.', 5000);
  else if (mode === 'working') {
    if (prev === 'away' || prev === 'off') openWelcome();
    else Pip.set('encourage', 'Welcome back from your break!', 4000);
  }
}

});

  const f = e.target, fn = FORMS[f.dataset.form];
  if (fn) { e.preventDefault(); const D = typeof Drafts !== 'undefined' ? Drafts : null; const keys = [...new Set($$('[data-draft]', f).map(x => x.dataset.draft))]; if (D) { f.dataset.submitting = '1'; keys.forEach(k => D.clear(k)); } fn(f); if (D && document.contains(f)) { delete f.dataset.submitting; D.capture(); } }
});
document.addEventListener('keydown', e => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === 'Escape' && $('#modal-root').innerHTML) { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.target.id === 'dump-text' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); return; }
  if (e.target.id === 'sub-input' && e.key === 'Enter') { e.preventDefault(); ACT['sub-add'](); return; }
  if (!inField && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'n' && !$('#modal-root').innerHTML) { e.preventDefault(); openTaskModal(null); }
  // keep keyboard focus inside open dialogs
  if (e.key === 'Tab' && $('#modal-root').innerHTML) {
    const items = $$('#modal-root button, #modal-root input, #modal-root select, #modal-root textarea, #modal-root a[href], #modal-root summary').filter(x => !x.disabled && x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

  if (el.name === 'ws' && el.closest('[data-form=task]')) {
    M.draft.ws = el.value; M.draft.category = '';
    const sel = $('#cat-select'); if (sel) sel.innerHTML = `<option value="">— none —</option>` + CATEGORIES[el.value].map(c => `<option>${esc(c)}</option>`).join('');
  }
  if (el.dataset.setting) {
    const k = el.dataset.setting;
    if (k.endsWith('Days')) S.settings[k] = $$(`[data-setting="${k}"]:checked`).map(x => +x.value);
    else if (el.type === 'checkbox') S.settings[k] = el.checked;
    else if (el.type === 'text') S.settings[k] = el.value.trim();
    else S.settings[k] = clamp(parseInt(el.value, 10) || 0, +el.min || 0, +el.max || 999);
    if (k === 'focusMinutes' && !S.focus.timer.running) resetTimer(S.settings.focusMinutes);
    commit(); if (k === 'showCompanion' && el.checked) Pip.set('celebrate', 'Hello again!', 3000);
  }
  EXT_CHANGE.forEach(fn => fn(el));
  if (el.id === 'import-file' && el.files[0]) { handleImport(el.files[0]); el.value = ''; }
});
window.addEventListener('hashchange', () => { closeModal(); render(); });
window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue) { try { S = migrate(JSON.parse(e.newValue)); render(); } catch (_) {} } });
window.addEventListener('beforeunload', () => { if (typeof Drafts !== 'undefined') Drafts.capture(); quietSave = true; save(); });

/* ---------- timers ---------- */
function tick() {
  const t = S.focus.timer;
  if (!t.running) { if (document.title !== 'Mahika Productivity App') document.title = 'Mahika Productivity App'; return; }
  const rem = timerRemaining();
  const disp = $('#timer-display'), arc = $('#timer-arc');
  if (disp) disp.textContent = fmtClock(rem);
  if (arc) { const c = 2 * Math.PI * 70; arc.setAttribute('stroke-dashoffset', (c * (1 - rem / t.duration)).toFixed(1)); }
  document.title = `${fmtClock(rem)} · Focus`;
  if (rem <= 0) {
    t.running = false; t.remaining = 0; t.endsAt = null; save();
    chime(); Pip.set('celebrate', pick(LINES.timer), 7000);
    toast('Focus timer finished. Lovely effort.', { art: flowerSVG({ type: 4, size: 26 }) });
    if (currentView() === 'focus') render();
  }
}
function maybeWelcome(gapMs) {
  if (gapMs > 6 * 3600e3 && liveTasks().length && Date.now() - S.welcomeShownAt > 3600e3) openWelcome();
}

/* ---------- start ---------- */
function init() {
  load();
  const gap = Date.now() - (S.lastSeen || Date.now());
  const d = todayPH();
  let returning = false;
  // A one-day "Day Off" ends by itself the next day.
  if (S.status.mode === 'off' && !isOff('sts', d) && !isOff('bb', d)) { S.status = { mode: 'working', since: Date.now(), prev: 'off' }; returning = true; }
  $('#companion-art').innerHTML = companionSVG();
  save(); render(); Pip.reset();
  EXT_INIT.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  if (storageBroken) toast('This browser is blocking storage, so changes may not be kept. Try Safari or Chrome normally (not private mode).', { ms: 12000 });
  if (returning) openWelcome(); else maybeWelcome(gap);
  if (!$('#modal-root').innerHTML) setTimeout(() => Pip.say((typeof bkNudge === 'function' && bkNudge()) || pick(LINES.greet), 5000), 600);
  setInterval(tick, 1000);
  setInterval(renderClocks, 20000);
  let lastDay = d;
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    const g = Date.now() - S.lastSeen; // large gap = Mac was asleep
    quietSave = true; save(); quietSave = false; // heartbeat
    if (!$('#modal-root').innerHTML) maybeWelcome(g);
    const now = todayPH(); if (now !== lastDay) { lastDay = now; if (!$('#modal-root').innerHTML) render(); }
  }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { const g = Date.now() - S.lastSeen; quietSave = true; save(); quietSave = false; if (!$('#modal-root').innerHTML) { render(); maybeWelcome(g); } }
  });
}
init();

/* ---------- Dark mode ---------- */
function applyTheme() {
  const dark = !!S.settings.darkMode, b = $('#theme-btn');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (b) { b.innerHTML = dark ? icon('today') : icon('rest'); b.title = dark ? 'Switch to light mode' : 'Switch to dark mode'; b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', dark); }
}
ACT['theme-toggle'] = () => { S.settings.darkMode = !S.settings.darkMode; commit(); };

</script>
